# 来源分流：本机/容器网络与 Tailscale 免密，公网访问一律要密码。
# Docker 端口映射（iptables DNAT）保留真实来源 IP；宿主机访问 127.0.0.1:8080
# 经 docker-proxy 进来，来源是 Docker 网桥网关（172.16.0.0/12）。
geo $uht_trusted {
    default        0;
    127.0.0.0/8    1;
    172.16.0.0/12  1;
    100.64.0.0/10  1;  # Tailscale
}

map $uht_trusted $uht_auth_realm {
    1       off;
    default "Unified Holdings Tracker";
}

# 只对公网来源限速（键为空的请求不计数），挡住撞库式猜密码
map $uht_trusted $uht_public_key {
    1       "";
    default $binary_remote_addr;
}
limit_req_zone $uht_public_key zone=uht_public:1m rate=10r/s;

server {
    listen 80;
    server_name _;

    # 公网来源需 Basic Auth（密码文件由 compose 挂载到 /etc/nginx/.htpasswd，见 deploy/DEPLOY.md）
    auth_basic $uht_auth_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;
    limit_req zone=uht_public burst=60 nodelay;
    limit_req_status 429;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API reverse proxy to backend container
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
